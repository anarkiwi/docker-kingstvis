name: release

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'anarkiwi/kingstvis' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: resolve version
        id: v
        run: |
          version=$(sed -n 's/^ARG KINGSTVIS_VERSION=//p' Dockerfile)
          [ -n "${version}" ] || { echo "no KINGSTVIS_VERSION in Dockerfile" >&2; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: check docker hub credentials
        id: hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "enabled=${TOKEN:+true}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v4

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kingstvis:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: tests/smoke.sh kingstvis:release ${{ steps.v.outputs.version }}

      - name: login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: login to docker hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: image tags
        id: tags
        env:
          VERSION: ${{ steps.v.outputs.version }}
          HUB: ${{ steps.hub.outputs.enabled == 'true' && env.DOCKERHUB_IMAGE || '' }}
        run: |
          {
            echo 'tags<<EOF'
            for image in "${GHCR_IMAGE}" ${HUB}; do
              printf '%s:%s\n%s:latest\n' "${image}" "${VERSION}" "${image}"
            done
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          annotations: |
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "release ${VERSION} already exists; images refreshed"
            exit 0
          fi
          cat > notes.md <<EOF
          Container image of KingstVIS ${VERSION}, from
          <https://www.qdkingst.com/en/download>.

              docker pull ${GHCR_IMAGE}:${VERSION}
          EOF
          gh release create "${VERSION}" --target "${GITHUB_SHA}" \
            --title "${VERSION}" --notes-file notes.md
