name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: shellcheck
        run: shellcheck entrypoint.sh bin/kingstvis-docker tests/smoke.sh
      - name: actionlint
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:latest -color

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kingstvis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: tests/smoke.sh kingstvis:ci
